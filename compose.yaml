services:
  postgres:
    image: 'postgres:13.22-alpine3.21'
    restart: always
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./volumes/postgres:/data/postgres
    ports:
      - "5433:5432"