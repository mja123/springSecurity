spring.application.name=security
spring.profiles.active=dev

server.servlet.context-path=/api

# Postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Auth0 Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://your-domain.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audience=${AUTH0_AUDIENCE:your-api-identifier}

# Auth0 Custom Claims Configuration
# Set this to your Auth0 domain for roles namespace (e.g., https://your-domain.auth0.com/roles)
# Leave empty to use default 'roles' claim
auth0.roles-claim-namespace=${AUTH0_ROLES_CLAIM_NAMESPACE:}

