apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: spring-security
  labels:
    app: postgres
spec:
  # Headless service: gives the StatefulSet a stable DNS name (postgres:5432)
  # for the backend's POSTGRES_URL to resolve against.
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
