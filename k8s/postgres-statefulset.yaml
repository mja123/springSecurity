apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Database name the backend connects to (matches /security in POSTGRES_URL).
            - name: POSTGRES_DB
              value: "security"
            # PGDATA must point at a subdirectory of the mount, not the mount root,
            # because the volume's lost+found confuses initdb otherwise.
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            # --- Sensitive configuration ---
            # Provided by a Secret created manually via CLI, e.g.:
            #   kubectl create secret generic postgres-secret \
            #     --from-literal=POSTGRES_USER='security' \
            #     --from-literal=POSTGRES_PASSWORD='...'
            # The same user/password must appear in the backend's POSTGRES_URL.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Readiness/liveness via pg_isready against the configured user/db.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  # Each replica gets its own durable PersistentVolume for the data directory.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
